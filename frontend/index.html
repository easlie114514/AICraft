<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_craft.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICraft</title>
    <!-- 同步写入 CSS 变量到 :root，绕过 CSS 文件加载依赖，彻底消灭主题闪烁 -->
    <script>
      (function() {
        try {
          var THEMES = {
            sky:          { primary: '#0EA5E9', hover: '#0284C7', light: '#F0F9FF', lighter: '#F7FDFF', fg: '#FFFFFF', ring: '#0EA5E9', nav: '#0C4A6E', input: '#E6F2F8', glow: '#38BDF8', secondary: '#38BDF8' },
            mint:         { primary: '#10B981', hover: '#059669', light: '#ECFDF5', lighter: '#F6FEF9', fg: '#FFFFFF', ring: '#10B981', nav: '#064E3B', input: '#E6F5EE', glow: '#34D399', secondary: '#34D399' },
            sakura:       { primary: '#EC4899', hover: '#DB2777', light: '#FDF2F8', lighter: '#FEF7FB', fg: '#FFFFFF', ring: '#EC4899', nav: '#4A1030', input: '#F2E5ED', glow: '#F472B6', secondary: '#F472B6' },
            'dusk-berry':  { primary: '#BC5A8C', hover: '#A04470', light: '#FBF5F8', lighter: '#FDF9FB', fg: '#FFFFFF', ring: '#BC5A8C', nav: '#4F467D', input: '#EDE8EE', glow: '#BC5A8C', secondary: '#4F467D' },
            'ocean-lime':  { primary: '#9FD60B', hover: '#7FB000', light: '#F6FDE8', lighter: '#FBFEF4', fg: '#0F172A', ring: '#9FD60B', nav: '#2767C4', input: '#EAF0F8', glow: '#9FD60B', secondary: '#2767C4' },
            'forest-gold': { primary: '#C9A954', hover: '#AB8B36', light: '#FBF8F1', lighter: '#FDFCF8', fg: '#0F172A', ring: '#C9A954', nav: '#145A33', input: '#EAEDEA', glow: '#C9A954', secondary: '#145A33' },
            'royal-lemon': { primary: '#FFDC1E', hover: '#E5C500', light: '#FFFDEB', lighter: '#FFFEF5', fg: '#0F172A', ring: '#FFDC1E', nav: '#501E78', input: '#F2EDE8', glow: '#FFDC1E', secondary: '#501E78' },
          };

          var t = localStorage.getItem('aicraft_theme');
          var c = THEMES[t] || THEMES.sky;
          var s = document.documentElement.style;
          // --theme-* 供直接引用 var(--theme-*) 的组件使用（如 ReplyGlowBar）
          s.setProperty('--theme-primary', c.primary, 'important');
          s.setProperty('--theme-primary-hover', c.hover, 'important');
          s.setProperty('--theme-primary-light', c.light, 'important');
          s.setProperty('--theme-primary-lighter', c.lighter, 'important');
          s.setProperty('--theme-primary-foreground', c.fg, 'important');
          s.setProperty('--theme-ring', c.ring, 'important');
          s.setProperty('--theme-nav-bg', c.nav, 'important');
          s.setProperty('--theme-input', c.input, 'important');
          s.setProperty('--theme-glow-bar', c.glow, 'important');
          s.setProperty('--theme-secondary', c.secondary, 'important');
          // --color-* 供 Tailwind 工具类使用（bg-primary → var(--color-primary)）
          // 绕过 CSS @theme 映射，CSS 文件未加载时也能正确解析
          s.setProperty('--color-primary', c.primary, 'important');
          s.setProperty('--color-primary-hover', c.hover, 'important');
          s.setProperty('--color-primary-light', c.light, 'important');
          s.setProperty('--color-primary-lighter', c.lighter, 'important');
          s.setProperty('--color-ring', c.ring, 'important');
          s.setProperty('--color-nav-bg', c.nav, 'important');
          s.setProperty('--color-input', c.input, 'important');
          s.setProperty('--color-glow-bar', c.glow, 'important');
          s.setProperty('--color-secondary-accent', c.secondary, 'important');
          document.documentElement.classList.add('theme-' + (THEMES[t] ? t : 'sky'));
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
